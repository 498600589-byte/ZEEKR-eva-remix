<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17161c">
  <meta name="description" content="同屏比较四个 EVA Remix 版本的开心和左右看动效。">
  <title>EVA Remix · 风格对比</title>
  <link rel="stylesheet" href="preview.css">
  <link rel="stylesheet" href="hub.css">
  <script src="hub.js?v=smooth" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <span class="wordmark">EVA REMIX</span>
      <a href="https://github.com/498600589-byte/Zeekr-EVA-remix">GitHub ↗</a>
    </div>
  </header>
  <main class="wrap">
    <section class="hub-intro" aria-labelledby="title">
      <h1 id="title">EVA 表情风格对比</h1>
      <p>选一个动作，横向看同一表情在不同版本里的样子。</p>
    </section>
    <section aria-labelledby="compare-title">
      <div class="compare-bar">
        <h2 id="compare-title">同一动作，四个版本</h2>
        <div class="actions" aria-label="选择对比动作">
          <button class="play" type="button" data-action="happy" aria-pressed="true">开心</button>
          <button class="play" type="button" data-action="look" aria-pressed="false">左右看</button>
          <button class="play" type="button" id="motion">显示静帧</button>
        </div>
      </div>
      <div class="style-grid">
        <article class="style-card" data-style="nailoong">
          <div class="screen"><img src="media/compare/nailoong/happy.png" alt="奶龙的开心表情"></div>
          <h3>奶龙</h3>
          <p>116 项网页动效</p>
          <a href="library.html#library">看全部表情</a>
        </article>
        <article class="style-card" data-style="character">
          <div class="screen"><img src="media/compare/character/happy.png" alt="炫蓝闪电的开心表情"></div>
          <h3>四角色机甲</h3>
          <p>炫蓝闪电等四套完整资源</p>
          <a href="https://github.com/498600589-byte/Zeekr-EVA-remix/releases/tag/v2.2.0">选角色下载</a>
        </article>
        <article class="style-card" data-style="colorway">
          <div class="screen"><img src="media/compare/colorway/happy.png" alt="五色机甲样例的开心表情"></div>
          <h3>五色机甲样例</h3>
          <p>五种配色，六项表情</p>
          <a href="https://github.com/498600589-byte/Zeekr-EVA-remix/releases/tag/v2.1.0">查看样例包</a>
        </article>
        <article class="style-card" data-style="jojo">
          <div class="screen"><img src="media/compare/jojo/happy.png" alt="JOJO 动态版的开心表情"></div>
          <h3>JOJO 动态版</h3>
          <p>完整漫画动效资源</p>
          <a href="https://github.com/498600589-byte/Zeekr-EVA-remix/releases/tag/v2.0.0">下载整套</a>
        </article>
      </div>
    </section>
    <nav class="archive" aria-label="历史发布与说明">
      <a href="https://github.com/498600589-byte/Zeekr-EVA-remix/releases">历史发布</a>
      <a href="https://github.com/498600589-byte/Zeekr-EVA-remix/blob/main/docs/eva-setup.md">安装与恢复</a>
      <a href="https://github.com/498600589-byte/Zeekr-EVA-remix/tree/main/docs/nailoong">奶龙更新说明</a>
    </nav>
  </main>
</body>
</html>
